services:
  - type: web
    runtime: node
    name: love-and-peace
    buildCommand: npm ci --prefix server
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LANDING_PAGE
        value: /home.html
      - key: ENABLE_LOCAL_HTTPS
        value: "false"
